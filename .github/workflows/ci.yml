name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Browsers and display for the end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (incl. the model harness against the mock server)
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end (browser + desktop app)
        run: xvfb-run -a node tests/run-e2e.mjs --electron

      - name: Screenshots and exported PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/out
          if-no-files-found: ignore
